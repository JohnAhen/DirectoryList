<!DOCTYPE html>
<html>
<head>
  <title>Directory Login</title>

  <!-- reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .card {
      background: rgba(255,255,255,0.06);
      padding: 30px;
      border-radius: 16px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    h2 {
      margin-bottom: 5px;
    }

    p {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #2563eb;
    }

    .msg {
      margin-top: 10px;
      font-size: 13px;
      color: #f87171;
    }

    .g-recaptcha {
      margin-top: 10px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Directory Login</h2>
  <p>Secure access required</p>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <!-- CAPTCHA -->
  <div class="g-recaptcha" data-sitekey="6LedqvwsAAAAAEN5btMAlWh_0GvYOfsryKGILrty"></div>

  <button onclick="login()">Login</button>

  <div class="msg" id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUQ9_cgFhTSzAF4gxq0OOSpcoRrxqmV7w",
  authDomain: "church-directory-d9624.firebaseapp.com",
  projectId: "church-directory-d9624",
  storageBucket: "church-directory-d9624.firebasestorage.app",
  messagingSenderId: "245172853071",
  appId: "1:245172853071:web:368fd886823c58cdb0cd3a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function () {

  const captcha = grecaptcha.getResponse();

  if (!captcha) {
    document.getElementById("msg").innerText = "Please complete CAPTCHA";
    return;
  }

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      window.location.href = "index.html";
    })
    .catch(err => {
      document.getElementById("msg").innerText = err.message;
      grecaptcha.reset();
    });
};
</script>

</body>
</html>
